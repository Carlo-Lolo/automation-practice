<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班次查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei';background:#e8f4f8;padding:15px}
.container{background:#fff;border-radius:16px;padding:20px;max-width:500px;margin:0 auto}
h1{text-align:center;font-size:22px;color:#2c3e50;margin-bottom:15px}
.setup-box{background:#f0f7fa;border-radius:12px;padding:15px;margin-bottom:15px}
.setup-box label{font-weight:bold;font-size:14px;display:block;margin-bottom:8px}
.setup-row{display:flex;gap:10px;flex-wrap:wrap}
.setup-row input,.setup-row select{padding:12px;border:2px solid #d4e6f1;border-radius:10px;font-size:16px;flex:1;min-width:100px}
.setup-btn{padding:12px 20px;background:#5b9bd5;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;flex:1}
.query-buttons{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
.query-btn{padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;color:#fff;flex:1;min-width:70px;cursor:pointer}
.btn-week{background:#5b9bd5}
.btn-month{background:#4aa3c2}
.btn-custom{background:#7fb3d0}
.custom-query{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.custom-query input{flex:1;padding:12px;border:2px solid #d4e6f1;border-radius:10px;font-size:16px}
.custom-query button{padding:12px 20px;background:#5b9bd5;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer}
.result-box{display:none;margin-top:15px;padding:15px;background:#f7fbfd;border-radius:12px;border:1px solid #d4e6f1}
.result-box.show{display:block}
.result-item{display:flex;justify-content:space-between;padding:10px;margin:5px 0;background:#fff;border-radius:8px;border-left:3px solid #5b9bd5}
.result-item.today{background:#eaf4fa;border-left-color:#f39c12;font-weight:bold}
.cycle-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px;padding:12px;background:#f0f7fa;border-radius:12px;text-align:center}
.cycle-item{background:#fff;padding:8px;border-radius:8px;border:1px solid #d4e6f1}
.cycle-item .name{font-size:15px;font-weight:bold}
.cycle-item .time{font-size:11px;color:#7f8c8d}
.status{padding:8px 12px;background:#d5e8f0;border-radius:8px;font-size:13px;margin-top:10px;display:flex;justify-content:space-between}
@media(max-width:400px){.setup-row{flex-direction:column}.query-buttons{flex-direction:column}.custom-query{flex-direction:column}.cycle-info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>📅 班次查询</h1>
<div class="setup-box">
<label>📌 设置起始日期和班次</label>
<div class="setup-row">
<input type="date" id="startDate">
<select id="startShift">
<option value="0">🌅 早班</option>
<option value="1">🌙 晚班</option>
<option value="2" selected>☀️ 正常班</option>
</select>
<button class="setup-btn" onclick="setStart()">确认</button>
</div>
<div class="status"><span>📅 <span id="d1">-</span></span><span>📌 <span id="d2">-</span></span></div>
</div>
<div class="query-buttons">
<button class="query-btn btn-week" onclick="qWeek()">📊 本周</button>
<button class="query-btn btn-month" onclick="qMonth()">📆 本月</button>
<button class="query-btn btn-custom" onclick="toggleC()">🔍 指定日</button>
</div>
<div class="custom-query" id="cq" style="display:none">
<input type="date" id="td"><button onclick="qCustom()">查询</button>
</div>
<div class="result-box" id="rb"><div id="rh"></div><div id="rc"></div></div>
<div class="cycle-info">
<div class="cycle-item"><div class="name">🌅 早班</div><div class="time">04:30-13:00</div></div>
<div class="cycle-item"><div class="name">🌙 晚班</div><div class="time">13:00-22:00</div></div>
<div class="cycle-item"><div class="name">☀️ 正常班</div><div class="time">08:00-18:00</div></div>
</div>
</div>
<script>
const S=[{n:'早班',t:'04:30-13:00',e:'🌅'},{n:'晚班',t:'13:00-22:00',e:'🌙'},{n:'正常班',t:'08:00-18:00',e:'☀️'}];
let sd='',si=2;
function up(){document.getElementById('d1').textContent=sd||'-';document.getElementById('d2').textContent=sd?S[si].n:'-';}
function setStart(){sd=document.getElementById('startDate').value;si=parseInt(document.getElementById('startShift').value);if(!sd){alert('请选择日期');return}up();qWeek()}
function gs(td){if(!sd)return null;let d=Math.floor((new Date(td)-new Date(sd))/(86400000));let i=(si+d)%3;if(i<0)i+=3;return{s:S[i],d:i+1,day:d}}
function wd(ds){return'周'+['日','一','二','三','四','五','六'][new Date(ds).getDay()]}
function fmt(ds){let p=ds.split('-');return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日'}
function show(ds,t){let b=document.getElementById('rb'),h=document.getElementById('rh'),c=document.getElementById('rc');b.className='result-box show';h.textContent=t;let html='',today=new Date().toISOString().split('T')[0];ds.forEach(d=>{let r=gs(d);if(!r)return;let is=d===today;html+=`<div class="${is?'result-item today':'result-item'}"><span>${fmt(d)} ${wd(d)}${is?' ⭐':''}</span><span>${r.s.e} ${r.s.n} ${r.s.t}</span></div>`});c.innerHTML=html}
function qWeek(){if(!sd){alert('请先设置起始日期');return}let d=[];for(let i=0;i<7;i++){let t=new Date();t.setDate(t.getDate()+i);d.push(t.toISOString().split('T')[0])}show(d,'📊 本周排班')}
function qMonth(){if(!sd){alert('请先设置起始日期');return}let t=new Date(),y=t.getFullYear(),m=t.getMonth(),days=new Date(y,m+1,0).getDate(),d=[];for(let i=1;i<=days;i++){let dt=new Date(y,m,i);d.push(dt.toISOString().split('T')[0])}show(d,'📆 '+y+'年'+(m+1)+'月')}
function toggleC(){let d=document.getElementById('cq');d.style.display=d.style.display==='none'?'flex':'none';if(d.style.display==='flex')document.getElementById('td').value=new Date().toISOString().split('T')[0]}
function qCustom(){if(!sd){alert('请先设置起始日期');return}let td=document.getElementById('td').value;if(!td){alert('请选择日期');return}let r=gs(td);if(!r)return;let b=document.getElementById('rb');b.className='result-box show';document.getElementById('rh').textContent='🔍 查询结果';document.getElementById('rc').innerHTML=`<div class="result-item today"><span>${fmt(td)} ${wd(td)}${td===new Date().toISOString().split('T')[0]?' ⭐今天':''}</span><span style="font-size:18px">${r.s.e} ${r.s.n} ${r.s.t}</span></div><div style="margin-top:10px;padding:10px;background:#f0f7fa;border-radius:8px;font-size:13px">📌 从起始日算起第 ${r.day+1} 天</div>`}
window.onload=function(){let t=new Date().toISOString().split('T')[0];document.getElementById('startDate').value=t;sd=t;si=2;up();qWeek()}
</script>
</body>
</html>
